{% extends "base.html" %}
{% block title %}Querido Diario - Iniciar Sesión{% endblock %}

{% block contenido %}
<!-- ✧ Cabecera de bienvenida -->
<div class="login-header">
    <h1>𖡎 Querido Diario</h1>
    <p>Tu espacio privado para escribir cada día ˙ᵕ˙</p>
</div>

<div class="grid-2">
    <!-- ✧ Formulario de registro -->
    <div class="login-card">
        <h3>Crear Cuenta</h3>
        <form method="post" action="{{ url_for('registro') }}">
            <div class="mb-3">
                <label>Nombre</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Apellido</label>
                <input type="text" name="apellido" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Edad</label>
                <input type="number" name="edad" class="form-control" min="18" max="120"
                    placeholder="Debes tener al menos 18 años" required>
            </div>
            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" name="contrasena" class="form-control" required minlength="8">
                <small style="font-size:0.75rem; color:#5a6b5e; display:block; margin-top:4px;">Mín. 8 caract., 1
                    mayúscula, 1 número y 1 símbolo.</small>
            </div>
            <div class="mb-3">
                <label>Confirmar Contraseña</label>
                <input type="password" name="confirmar_contrasena" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn btn-dark w-100">Registrarse</button>
        </form>
    </div>

    <!-- ✧ Formulario de inicio de sesión -->
    <div class="login-card">
        <h3>Iniciar Sesión</h3>
        <form method="post" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label>E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" name="contrasena" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Iniciar Sesión</button>
        </form>
    </div>
</div>
{% endblock %}
