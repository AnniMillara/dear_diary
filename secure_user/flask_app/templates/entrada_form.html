{% extends "base.html" %}
{% block title %}{{ 'Editar' if entrada and entrada.id_entrada else 'Nueva' }} Entrada{% endblock %}
{% block contenido %}

<div class="page-header">
    <div>
        <h2>{{ 'Editar' if entrada and entrada.id_entrada else 'Nueva' }} Entrada</h2>
        <p>Completa los detalles de tu recuerdo.</p>
    </div>
    <a class="btn btn-secondary" href="{{ url_for('listado_entradas') }}">← Volver</a>
</div>

<div class="card-bookhub">
    <form method="post"
        action="{{ url_for('modificar_entrada', id=entrada.id_entrada) if entrada and entrada.id_entrada else url_for('crear_entrada') }}">

        <div class="form-grid">
            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input id="fecha" name="fecha" type="date" class="form-control"
                    value="{% if entrada and entrada.fecha %}{{ entrada.fecha if entrada.fecha is string else entrada.fecha.strftime('%Y-%m-%d') }}{% endif %}"
                    required>
            </div>

            <div class="form-group">
                <label for="emoji">Emoji</label>
                <input id="emoji" name="emoji" type="text" class="form-control" maxlength="10" placeholder="Ej: 😊"
                    value="{% if entrada and entrada.emoji %}{{ entrada.emoji }}{% endif %}">
            </div>
        </div>

        <div class="form-group mb-3">
            <label for="contenido">Contenido</label>
            <textarea id="contenido" name="contenido" class="form-control" maxlength="5000"
                required>{{ entrada.contenido if entrada and entrada.contenido else '' }}</textarea>
        </div>

        <div class="d-flex gap-2 flex-wrap mt-4">
            <button class="btn btn-dark">{{ 'Guardar Cambios' if entrada and entrada.id_entrada else 'Guardar Entrada'
                }}</button>
            <a class="btn btn-secondary" href="{{ url_for('listado_entradas') }}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
