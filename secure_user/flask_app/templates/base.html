<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Querido Diario{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>{% if session.get('id_usuario') %}<nav class="navbar"><a class="brand" href="{{ url_for('listado_entradas') }}">📖 Querido Diario</a><div class="links"><a href="{{ url_for('listado_entradas') }}">Mis Entradas</a><a href="{{ url_for('nueva_entrada') }}">Nueva Entrada +</a><a href="{{ url_for('buscar_entradas') }}">Buscar</a><a href="{{ url_for('logout') }}">Cerrar sesión</a></div></nav>{% endif %}<main class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block contenido %}{% endblock %}</main><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
