{% extends "base.html" %}
{% block title %}Entrada — Querido Diario{% endblock %}
{% block contenido %}
<header class="page-header">
    <div><h1>Entrada del {{ entrada.fecha.strftime('%d/%m/%Y') }}</h1><p>Un recuerdo de tu diario privado.</p></div>
    <a href="{{ url_for('entrada.listar') }}" class="btn btn-secondary">← Mis entradas</a>
</header>
<article class="card entrada-detalle">
    <div class="entrada-contenido">{{ entrada.contenido }}</div>
    <div class="form-actions mt-4">
        <a class="btn btn-warning" href="{{ url_for('entrada.editar', entrada_id=entrada.id) }}">Editar</a>
        <a class="btn btn-danger" href="{{ url_for('entrada.eliminar', entrada_id=entrada.id) }}">Eliminar</a>
    </div>
</article>
{% endblock %}
